# Include in Nginx's http context (e.g. /etc/nginx/conf.d/kiiom-website.conf).
# For an existing HTTPS site, merge the location block into its TLS server block
# and keep its certificate settings and HTTP-to-HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name kiiom.com www.kiiom.com;

    location / {
        # Must match EC2_HOST_PORT in GitHub Actions (default: 3000).
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Allow Next.js streamed responses through immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}
